.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{background:var(--soft);border-radius:10px;padding:8px 10px;min-height:96px}
.bd .lb{font-size:12px;color:var(--mut)}.bd b{font-size:22px;display:block;line-height:1.2}

.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.scroll{overflow-x:auto}select{padding:6px;border-radius:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
svg text{fill:var(--mut);font-size:11px}
a{color:var(--acc);text-decoration:none}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rec .box{border:1px solid var(--bd);border-radius:10px;padding:10px}
.rec .it{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}

document.getElementById('detail').innerHTML=D.complexes.map(c=>`<div class="card"><details><summary>${c.name} 전체 매물 (${c.items.length}건)</summary><div class="scroll"><table><tr><th>평형</th><th>가격</th><th>층</th><th>동</th><th>등록</th><th>중개사</th><th></th></tr>${c.items.map(r=>`<tr><td>${r.pyeong}평</td><td>${E(r.price)}${r.prev_price&&r.prev_price!=r.price?' <span class="sub">(전일 '+E(r.prev_price)+')</span>':''}</td><td>${r.floor}</td><td>${r.dong}</td><td>${r.expose.slice(5)}</td><td>${r.realtors}</td><td>${T[r.status]||''} <a href="${link(r)}" target="_blank">보기</a></td></tr>`).join('')}</table></div></details></div>`).join('');
// 추천
const R=D.recs,med=['🥇','🥈','🥉'];
const box=(t,lst,sub,fmt)=>`<div class="box"><b>${t}</b><div class="sub">${sub}</div>${lst.length?lst.map((r,i)=>`<div class="it"><span><span class="medal">${med[i]||''}</span>${r.complex} ${r.pyeong}평 <span class="sub">${r.floor}층</span></span><span>${fmt(r)} <a href="${link(r)}" target="_blank">보기</a></span></div>`).join(''):'<div class="sub" style="padding:6px 0">해당 없음</div>'}</div>`;
document.getElementById('rec').innerHTML=
 box('⭐ 최저가 TOP3',R.lowest,'전체 단지 중 가장 싼 호가',r=>E(r.price)+(T[r.status]||''))+
 box('💎 평당가 최저',R.ppp,'가격÷평수 (만원/평, 단지별 1건)',r=>r.ppp.toLocaleString()+'만/평')+
 box('🆕 오늘 신규 최저',R.new,'어제 없던 새 매물 중 저렴한 순',r=>E(r.price))+
 box('🔻 가격 인하',R.down,'어제보다 내린 매물 (인하폭 큰 순)',r=>E(r.price)+' <span class="sub">(−'+((r.prev_price-r.price)/1e4).toLocaleString()+'만)</span>')+
 (D.has_trades?box('📉 실거래 대비 저렴',R.deal,'최근 실거래 3건 평균 대비 할인율',r=>E(r.price)+' <span class="gap-n">'+r.gap+'%</span>'):'');
document.getElementById('recnote').textContent=D.prev?'':'어제 데이터가 아직 없어 신규·인하 매물은 내일부터 표시됩니다.';
// 실거래
if(!D.has_trades){document.getElementById('trt').style.display='none';document.getElementById('trnote').textContent='실거래가 API 키를 프로그램에 등록하면 이 섹션과 "실거래 대비 저렴" 추천이 표시됩니다.'}
else{let h='<tr><th>단지</th><th>평형</th><th>최근 실거래</th><th>일자</th><th>최고(6개월)</th><th>호가 최저</th><th>괴리</th></tr>';
 D.complexes.forEach(c=>['30평대','40평대'].forEach(b=>{const x=c.bands[b];if(!x||!x.last_trade)return;const lt=x.last_trade,m=x.min;
  h+=`<tr><td>${c.name}</td><td>${b}</td><td>${E(lt.amount)} <span class="sub">${lt.pyeong}평 ${lt.floor}층</span></td><td>${lt.ymd.slice(2)}</td><td>${E(x.max_trade.amount)}</td><td>${m?E(m.price):'-'}</td><td>${m&&m.gap!=null?gapH(m.gap):''}</td></tr>`}));
 document.getElementById('trt').innerHTML=h;document.getElementById('trnote').textContent='국토부 실거래 신고 기준(신고 지연으로 최근 1~2달은 일부 누락 가능). 평형은 전용면적 기준 근사값입니다.'}
// removed
if(D.removed.length){document.getElementById('rm').style.display='';document.getElementById('rmt').innerHTML='<tr><th>단지</th><th>평형</th><th>가격</th><th>층</th></tr>'+D.removed.map(r=>`<tr><td>${r.complex_name}</td><td>${r.pyeong}평</td><td>${E(r.price)}</td><td>${r.floor}</td></tr>`).join('')}
// chart
const sel=document.getElementById('sel');
Object.keys(D.hist).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.replace('|',' · ');sel.appendChild(o)});
function draw(){const pts=D.hist[sel.value]||[];const W=Math.min(940,innerWidth-48),H=240,L=52,R=14,Tp=14,B=28;
const note=document.getElementById('chartnote');
if(!pts.length){document.getElementById('chart').innerHTML='데이터 없음';return}
const ys=pts.map(p=>p[1]/1e8);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn==mx){mn-=.5;mx+=.5}const pad=(mx-mn)*.15;mn-=pad;mx+=pad;
const x=i=>pts.length==1?(L+(W-L-R)/2):L+(W-L-R)*i/(pts.length-1),y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));
let s=`<svg width="${W}" height="${H}">`;
for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="4" y="${y(v)+4}">${v.toFixed(1)}억</text>`}
s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map((p,i)=>x(i)+','+y(p[1]/1e8)).join(' ')}"/>`;
pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p[1]/1e8)}" r="3.5" fill="var(--acc)"><title>${p[0]} ${E(p[1])} (${p[2]}건)</title></circle>`;
if(pts.length<=8||i%Math.ceil(pts.length/8)==0||i==pts.length-1)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${p[0].slice(5)}</text>`});
document.getElementById('chart').innerHTML=s+'</svg>';
note.textContent=pts.length<3?'호가 이력은 매일 쌓입니다. 며칠 지나면 추이가 보입니다.':'';}
sel.onchange=draw;addEventListener('resize',draw);draw();
// 실거래 1년 추이: 점=개별 거래, 선=월평균, 점선=현재 최저 호가
const sel2=document.getElementById('sel2');
if(!D.has_trades){document.getElementById('trchart').style.display='none'}
else{D.complexes.forEach(c=>['30평대','40평대'].forEach(b=>{if(c.tr_all.some(t=>band(t[1])==b)){const o=document.createElement('option');o.value=c.name+'|'+b;o.textContent=c.name+' · '+b;sel2.appendChild(o)}}))}
function draw2(){if(!sel2.value)return;const[nm,b]=sel2.value.split('|');const c=D.complexes.find(x=>x.name==nm);
 const tr=c.tr_all.filter(t=>band(t[1])==b).map(t=>({d:new Date(t[0]).getTime(),v:t[2]/1e8,py:t[1],f:t[3],s:t[0]})).sort((a,b)=>a.d-b.d);
 const ask=c.bands[b]&&c.bands[b].min?c.bands[b].min.price/1e8:null;
 const W=Math.min(940,innerWidth-48),H=260,L=52,R=14,Tp=14,B=28;
 const vs=tr.map(t=>t.v).concat(ask?[ask]:[]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn==mx){mn-=.5;mx+=.5}const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
 const t0=Math.min(...tr.map(t=>t.d),Date.now()-365*864e5),t1=Date.now();
 const x=d=>L+(W-L-R)*(d-t0)/(t1-t0||1),y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));
 let s=`<svg width="${W}" height="${H}">`;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="4" y="${y(v)+4}">${v.toFixed(1)}억</text>`}
 for(let k=0;k<=12;k+=2){const d=new Date();d.setMonth(d.getMonth()-12+k);d.setDate(1);s+=`<text x="${x(d.getTime())}" y="${H-8}" text-anchor="middle">${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}</text>`}
 const mm={};tr.forEach(t=>{const k=t.s.slice(0,7);(mm[k]=mm[k]||[]).push(t)});
 const avg=Object.keys(mm).sort().map(k=>({d:new Date(k+'-15').getTime(),v:mm[k].reduce((a,t)=>a+t.v,0)/mm[k].length}));
 if(avg.length>1)s+=`<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${avg.map(p=>x(p.d)+','+y(p.v)).join(' ')}"/>`;
 tr.forEach(t=>{s+=`<circle cx="${x(t.d)}" cy="${y(t.v)}" r="4" fill="var(--acc)" fill-opacity=".45"><title>${t.s} ${t.v.toFixed(2)}억 ${t.py}평 ${t.f}층</title></circle>`});
 if(ask)s+=`<line x1="${L}" x2="${W-R}" y1="${y(ask)}" y2="${y(ask)}" stroke="var(--down)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(ask)-4}" text-anchor="end" style="fill:var(--down)">현재 최저 호가 ${ask.toFixed(2)}억</text>`;
 document.getElementById('chart2').innerHTML=s+'</svg>';
 const last=tr[tr.length-1];
 document.getElementById('chart2note').textContent=`거래 ${tr.length}건 · 점=개별 거래, 파란선=월평균, 빨간 점선=현재 최저 호가`+(last?` · 최근 ${last.s} ${last.v.toFixed(2)}억`:'');}
sel2.onchange=draw2;addEventListener('resize',draw2);draw2();
document.getElementById('kk').textContent=D.kakao;
function cp(){navigator.clipboard.writeText(D.kakao).then(()=>document.getElementById('ok').textContent='복사됨 ✓').catch(()=>{const r=document.createRange();r.selectNode(document.getElementById('kk'));getSelection().addRange(r);document.execCommand('copy');document.getElementById('ok').textContent='복사됨 ✓'})}
</script></body></html>
